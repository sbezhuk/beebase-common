# Shared Azure Pipelines template for every BeeBase service. Each
# service repo's own azure-pipelines.yml extends this with just its own
# name and whether it ships database migrations - see e.g.
# beebase-auth-service/azure-pipelines.yml.
#
# Test -> Build -> push a Git-SHA-tagged image to ECR, and stop there.
# This template deliberately does NOT deploy to production: BeeBase is 7
# independent repositories, each on its own commit SHA, so no single
# service pipeline can know the correct image tag for the other 6.
# Production deployment is a separate, dedicated release pipeline
# (beebase-gateway/deploy/azure-pipelines-release.yml) that resolves the
# latest successful build of all 7 service pipelines, combines their
# exact SHAs into one release manifest, and deploys that manifest
# atomically via deploy.sh - see that file and beebase-gateway/README.md
# ("Production deployment") for the full flow.
#
# Requires the "AWS Toolkit for Azure DevOps" marketplace extension and
# an AWS service connection configured for OIDC/workload-identity
# federation (no long-lived AWS access keys stored in Azure DevOps) -
# see beebase-gateway/README.md's "Azure DevOps configuration required"
# section for the one-time setup.

parameters:
  - name: serviceName # must match the ECR repository name, e.g. "beebase-auth-service"
    type: string
  - name: hasMigrations # true for the 5 database-backed services
    type: boolean
    default: false
  - name: awsServiceConnection
    type: string
    default: "AWS-BeeBase-OIDC"

trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  - group: beebase-prod-pipeline # AWS_REGION, AWS_ACCOUNT_ID - used to push to ECR below (EC2_INSTANCE_ID lives in this group too, but only the release pipeline reads it)
  - name: imageTag
    value: $(Build.SourceVersion) # full 40-char Git commit SHA - immutable, never "latest"

stages:
  # --- Test ---

  - stage: Test
    jobs:
      - job: GoTestAndVet
        steps:
          - task: GoTool@0
            inputs:
              version: "1.27"
          - script: |
              set -euo pipefail
              go vet ./...
              go test ./...
            displayName: "go vet && go test"

  # --- Build & push immutable images to ECR ---

  - stage: Build
    dependsOn: Test
    jobs:
      - job: BuildAndPush
        steps:
          - script: |
              set -euo pipefail
              # QEMU user-mode emulation for the arm64 runtime stage's
              # `apk add` step; the Go build stage itself cross-compiles
              # natively via TARGETOS/TARGETARCH, no emulation needed for it.
              docker run --rm --privileged tonistiigi/binfmt --install arm64
              # Microsoft-hosted agents are fresh VMs per job, so this
              # never collides in practice; the fallback only matters on
              # a self-hosted/reused agent where the builder persists.
              docker buildx create --use --name beebase-builder || docker buildx use beebase-builder
            displayName: "Set up buildx + QEMU for linux/arm64"

          - task: AWSShellScript@1
            inputs:
              awsCredentials: "${{ parameters.awsServiceConnection }}"
              regionName: "$(AWS_REGION)"
              scriptType: "inline"
              inlineScript: |
                set -euo pipefail
                aws ecr get-login-password --region "$(AWS_REGION)" \
                  | docker login --username AWS --password-stdin "$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com"
            displayName: "Authenticate to ECR"

          - script: |
              set -euo pipefail
              REPO="$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com/${{ parameters.serviceName }}"
              docker buildx build \
                --platform linux/arm64 \
                --tag "${REPO}:$(imageTag)" \
                --push \
                .
            displayName: "Build & push app image (linux/arm64, tag=$(imageTag))"

          - ${{ if eq(parameters.hasMigrations, true) }}:
              - script: |
                  set -euo pipefail
                  REPO="$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com/${{ parameters.serviceName }}"
                  docker buildx build \
                    --platform linux/arm64 \
                    --tag "${REPO}:$(imageTag)-migrate" \
                    --push \
                    -f Dockerfile.migrate \
                    .
                displayName: "Build & push migrate image (tag=$(imageTag)-migrate)"

  # This template stops at Build, deliberately: production deployment
  # combines all 7 services' image tags into one release manifest and
  # deploys them together - see
  # beebase-gateway/deploy/azure-pipelines-release.yml.
