name: CI

# beebase-common ships no image of its own (it's a shared Go module
# every service imports) - test only, no build/push/AWS credentials.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - run: go vet ./...
      - run: go test ./...
